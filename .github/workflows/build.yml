name: Build Zygisk Module

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # Checkout
      # ==================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==================================================
      # Android SDK
      # ==================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ==================================================
      # Android NDK
      # ==================================================

      - name: Install Android NDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-24"
          sdkmanager "ndk;23.2.8568313"

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/23.2.8568313" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/23.2.8568313" >> "$GITHUB_ENV"

          echo "================================"
          echo "ANDROID NDK"
          echo "================================"

          echo "$ANDROID_SDK_ROOT/ndk/23.2.8568313"


      # ==================================================
      # Verify NDK
      # ==================================================

      - name: Verify Android Toolchain
        shell: bash
        run: |
          set -e

          test -d "$ANDROID_NDK_HOME"

          test -f \
            "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"

          echo "================================"
          echo "NDK VERSION"
          echo "================================"

          cat "$ANDROID_NDK_HOME/source.properties"

          echo ""
          echo "================================"
          echo "CLANG VERSION"
          echo "================================"

          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
            --version


      # ==================================================
      # Download Android-compatible Dobby
      # ==================================================

      - name: Download Dobby
        shell: bash
        run: |
          set -e

          rm -rf dobby

          git clone \
            --depth 1 \
            https://github.com/JingMatrix/Dobby.git \
            dobby

          test -f dobby/CMakeLists.txt
          test -f dobby/include/dobby.h

          echo "================================"
          echo "DOBBY SOURCE OK"
          echo "================================"

          cd dobby

          git log -1 --oneline


      # ==================================================
      # Show Dobby ARM64 source
      # ==================================================

      - name: Inspect Dobby
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "DOBBY ARM64 SOURCES"
          echo "================================"

          find dobby/source/TrampolineBridge/ClosureTrampolineBridge/arm64 \
            -maxdepth 1 \
            -type f \
            -print

          echo ""
          echo "================================"
          echo "DOBBY CMAKE ARM64 REFERENCES"
          echo "================================"

          grep -n \
            "ClosureTrampolineBridge/arm64" \
            dobby/CMakeLists.txt || true


      # ==================================================
      # Build ARM64
      # ==================================================

      - name: Build Arm64
        shell: bash
        run: |
          set -e

          rm -rf build_arm64

          cmake \
            -S . \
            -B build_arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DDOBBY_DEBUG=OFF \
            -DDOBBY_BUILD_EXAMPLE=OFF \
            -DDOBBY_BUILD_TEST=OFF \
            -DPrivate.Obfuscation=OFF

          cmake \
            --build build_arm64 \
            --parallel "$(nproc)"


      # ==================================================
      # Build ARMv7
      # ==================================================

      - name: Build Armv7
        shell: bash
        run: |
          set -e

          rm -rf build_armv7

          cmake \
            -S . \
            -B build_armv7 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DDOBBY_DEBUG=OFF \
            -DDOBBY_BUILD_EXAMPLE=OFF \
            -DDOBBY_BUILD_TEST=OFF \
            -DPrivate.Obfuscation=OFF

          cmake \
            --build build_armv7 \
            --parallel "$(nproc)"


      # ==================================================
      # Find Output
      # ==================================================

      - name: Find Output Libraries
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "ARM64 OUTPUTS"
          echo "================================"

          find build_arm64 \
            -type f \
            \( \
              -name "*.so" \
              -o -name "*.a" \
            \) \
            -print

          echo ""
          echo "================================"
          echo "ARMV7 OUTPUTS"
          echo "================================"

          find build_armv7 \
            -type f \
            \( \
              -name "*.so" \
              -o -name "*.a" \
            \) \
            -print


      # ==================================================
      # Verify Uptime Faker
      # ==================================================

      - name: Verify Uptime Faker
        shell: bash
        run: |
          set -e

          echo "Searching ARM64 library..."

          ARM64_LIB=$(find build_arm64 \
            -type f \
            -name "libuptime_faker.so" \
            | head -n 1)

          echo "Searching ARMv7 library..."

          ARMV7_LIB=$(find build_armv7 \
            -type f \
            -name "libuptime_faker.so" \
            | head -n 1)

          if [ -z "$ARM64_LIB" ]; then
            echo "ERROR: ARM64 libuptime_faker.so not found"
            exit 1
          fi

          if [ -z "$ARMV7_LIB" ]; then
            echo "ERROR: ARMv7 libuptime_faker.so not found"
            exit 1
          fi

          echo ""
          echo "================================"
          echo "ARM64 LIBRARY"
          echo "================================"

          echo "$ARM64_LIB"
          file "$ARM64_LIB"

          echo ""
          echo "================================"
          echo "ARMV7 LIBRARY"
          echo "================================"

          echo "$ARMV7_LIB"
          file "$ARMV7_LIB"


      # ==================================================
      # Package
      # ==================================================

      - name: Package ZIP
        shell: bash
        run: |
          set -e

          rm -rf dist
          rm -f UptimeFaker.zip

          mkdir -p dist/zygisk

          ARM64_LIB=$(find build_arm64 \
            -type f \
            -name "libuptime_faker.so" \
            | head -n 1)

          ARMV7_LIB=$(find build_armv7 \
            -type f \
            -name "libuptime_faker.so" \
            | head -n 1)

          cp "$ARM64_LIB" \
            dist/zygisk/arm64-v8a.so

          cp "$ARMV7_LIB" \
            dist/zygisk/armeabi-v7a.so

          cp module.prop \
            dist/module.prop

          cd dist

          zip -r ../UptimeFaker.zip .


      # ==================================================
      # Verify ZIP
      # ==================================================

      - name: Verify ZIP
        shell: bash
        run: |
          set -e

          test -f UptimeFaker.zip

          echo "================================"
          echo "ZIP CONTENTS"
          echo "================================"

          unzip -l UptimeFaker.zip

          echo ""
          echo "================================"
          echo "ZIP TEST"
          echo "================================"

          unzip -t UptimeFaker.zip


      # ==================================================
      # Upload
      # ==================================================

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UptimeFaker
          path: UptimeFaker.zip
          if-no-files-found: error
