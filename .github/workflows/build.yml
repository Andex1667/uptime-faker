name: Build Zygisk Module

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Dobby Source & Patch Assembly
        run: |
          git clone --recursive https://github.com/jmpews/Dobby.git dobby
          
          # Dobby의 구형 ARM64 어셈블리 문법을 최신 NDK/Clang 호환 문법으로 자동 패치
          python3 -c '
          import re
          path = "dobby/source/TrampolineBridge/ClosureTrampolineBridge/arm64/closure_bridge_arm64.asm"
          with open(path, "r") as f:
              content = f.read()
          content = re.sub(r"adrp\s+(\w+),\s*(.+?)@PAGE", r"adrp \1, :pg_hi21:\2", content)
          content = re.sub(r"add\s+(\w+),\s*(\w+),\s*(.+?)@PAGEOFF", r"add \1, \2, :lo12:\3", content)
          with open(path, "w") as f:
              f.write(content)
          '

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: 23.2.8568313

      - name: Build Arm64
        run: |
          mkdir build_arm64 && cd build_arm64
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 ..
          make
          
      - name: Build Armv7
        run: |
          mkdir build_armv7 && cd build_armv7
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=armeabi-v7a -DANDROID_PLATFORM=android-24 ..
          make

      - name: Package ZIP
        run: |
          mkdir -p dist/zygisk
          cp build_arm64/libuptime_faker.so dist/zygisk/arm64-v8a.so
          cp build_armv7/libuptime_faker.so dist/zygisk/armeabi-v7a.so
          cp module.prop dist/
          cd dist && zip -r ../UptimeFaker.zip *

      - uses: actions/upload-artifact@v4
        with:
          name: UptimeFaker
          path: UptimeFaker.zip
