name: Build Zygisk Module

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Dobby Source
        run: |
          git clone --recursive https://github.com/jmpews/Dobby.git dobby

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;23.2.8568313'

      - name: Set Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/23.2.8568313" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/23.2.8568313" >> "$GITHUB_ENV"

      - name: Build arm64-v8a
        run: |
          mkdir -p build_arm64
          cd build_arm64

          cmake \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            ..

          cmake --build . --config Release -j2

          cd ..

      - name: Build armeabi-v7a
        run: |
          mkdir -p build_armv7
          cd build_armv7

          cmake \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            ..

          cmake --build . --config Release -j2

          cd ..

      - name: Check Build Output
        run: |
          echo "=== arm64-v8a ==="
          find build_arm64 -name "*.so" -type f

          echo "=== armeabi-v7a ==="
          find build_armv7 -name "*.so" -type f

      - name: Package Magisk Module ZIP
        run: |
          mkdir -p module_out/zygisk
          mkdir -p module_out/META-INF/com/google/android

          cp module.prop module_out/

          cp build_arm64/libuptime_faker.so \
             module_out/zygisk/arm64-v8a.so

          cp build_armv7/libuptime_faker.so \
             module_out/zygisk/armeabi-v7a.so

          echo "#MAGISK" > module_out/META-INF/com/google/android/updater-script

          cd module_out
          zip -r ../UptimeFaker-Release.zip .
          cd ..

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UptimeFaker-Release
          path: UptimeFaker-Release.zip
