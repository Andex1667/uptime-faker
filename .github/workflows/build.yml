name: Build Zygisk Module

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Dobby
        run: |
          git clone --recursive https://github.com/jmpews/Dobby.git dobby

      - name: Patch Dobby ARM64 Assembly
        shell: bash
        run: |
          set -e

          ASM="dobby/source/TrampolineBridge/ClosureTrampolineBridge/arm64/closure_bridge_arm64.asm"

          echo "=== Original ARM64 relocation lines ==="
          grep -nE 'adrp|PAGE|PAGEOFF' "$ASM" || true

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "dobby/source/TrampolineBridge/"
              "ClosureTrampolineBridge/arm64/"
              "closure_bridge_arm64.asm"
          )

          text = path.read_text()

          old1 = "adrp TMP_REG_0, cdecl(common_closure_bridge_handler)@PAGE"
          old2 = "add TMP_REG_0, TMP_REG_0, cdecl(common_closure_bridge_handler)@PAGEOFF"

          new1 = "adrp TMP_REG_0, :pg_hi21:cdecl(common_closure_bridge_handler)"
          new2 = "add TMP_REG_0, TMP_REG_0, :lo12:cdecl(common_closure_bridge_handler)"

          if old1 not in text:
              raise SystemExit(
                  "ERROR: expected ADRP line was not found."
              )

          if old2 not in text:
              raise SystemExit(
                  "ERROR: expected ADD line was not found."
              )

          text = text.replace(old1, new1)
          text = text.replace(old2, new2)

          path.write_text(text)

          print("ARM64 assembly patched successfully.")
          PY

          echo "=== Patched ARM64 relocation lines ==="
          grep -nE 'adrp|PAGE|PAGEOFF|pg_hi21|lo12' "$ASM" || true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          set -e

          sdkmanager "ndk;23.2.8568313"

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/23.2.8568313" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/23.2.8568313" >> "$GITHUB_ENV"

      - name: Verify Android NDK
        run: |
          set -e

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROID_NDK=$ANDROID_NDK"

          test -d "$ANDROID_NDK_HOME"
          test -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"

          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

      - name: Build Arm64
        run: |
          set -e

          rm -rf build_arm64
          mkdir build_arm64
          cd build_arm64

          cmake \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DDOBBY_BUILD_SHARED=OFF \
            -DDOBBY_BUILD_STATIC=ON \
            ..

          cmake --build . --parallel "$(nproc)"

      - name: Build Armv7
        run: |
          set -e

          rm -rf build_armv7
          mkdir build_armv7
          cd build_armv7

          cmake \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-24 \
            -DDOBBY_BUILD_SHARED=OFF \
            -DDOBBY_BUILD_STATIC=ON \
            ..

          cmake --build . --parallel "$(nproc)"

      - name: Locate Built Library
        run: |
          echo "=== Arm64 ==="
          find build_arm64 -type f \
            \( -name "libuptime_faker.so" -o -name "libdobby*.a" \) \
            -print

          echo "=== Armv7 ==="
          find build_armv7 -type f \
            \( -name "libuptime_faker.so" -o -name "libdobby*.a" \) \
            -print

      - name: Package ZIP
        run: |
          set -e

          mkdir -p dist/zygisk

          test -f build_arm64/libuptime_faker.so
          test -f build_armv7/libuptime_faker.so

          cp build_arm64/libuptime_faker.so \
             dist/zygisk/arm64-v8a.so

          cp build_armv7/libuptime_faker.so \
             dist/zygisk/armeabi-v7a.so

          cp module.prop dist/

          cd dist
          zip -r ../UptimeFaker.zip .

      - name: Verify ZIP
        run: |
          echo "=== ZIP contents ==="
          unzip -l UptimeFaker.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UptimeFaker
          path: UptimeFaker.zip
