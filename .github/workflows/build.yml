name: Build Zygisk Module

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------
      # Android SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # --------------------------------------------------
      # Install exact NDK version
      # --------------------------------------------------
      - name: Install Android NDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-24"
          sdkmanager "ndk;23.2.8568313"

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/23.2.8568313" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/23.2.8568313" >> "$GITHUB_ENV"

          echo "NDK installed:"
          echo "$ANDROID_SDK_ROOT/ndk/23.2.8568313"


      # --------------------------------------------------
      # Verify toolchain
      # --------------------------------------------------
      - name: Verify Android Toolchain
        shell: bash
        run: |
          set -e

          test -d "$ANDROID_NDK_HOME"
          test -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"

          echo "=== NDK ==="
          cat "$ANDROID_NDK_HOME/source.properties"

          echo ""
          echo "=== Clang ==="
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
            --version

          echo ""
          echo "=== CMake ==="
          cmake --version


      # --------------------------------------------------
      # Download Android-compatible Dobby
      #
      # IMPORTANT:
      # Do NOT use jmpews/Dobby here.
      # --------------------------------------------------
      - name: Download Dobby
        shell: bash
        run: |
          set -e

          rm -rf dobby

          git clone --depth 1 \
            https://github.com/JingMatrix/Dobby.git \
            dobby

          echo "=== Dobby revision ==="
          cd dobby
          git log -1 --oneline


      # --------------------------------------------------
      # Verify Dobby source
      # --------------------------------------------------
      - name: Verify Dobby
        shell: bash
        run: |
          set -e

          test -f dobby/CMakeLists.txt
          test -f dobby/include/dobby.h
          test -f dobby/source/dobby.cpp

          echo "Dobby source OK"

          echo ""
          echo "Checking Android/ARM64 assembly..."

          test -f \
            dobby/source/TrampolineBridge/ClosureTrampolineBridge/arm64/closure_bridge_arm64.asm

          echo "ARM64 assembly OK"


      # --------------------------------------------------
      # Build ARM64
      # --------------------------------------------------
      - name: Build Arm64
        shell: bash
        run: |
          set -e

          rm -rf build_arm64

          cmake -S . -B build_arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DDOBBY_DEBUG=OFF \
            -DDOBBY_BUILD_EXAMPLE=OFF \
            -DDOBBY_BUILD_TEST=OFF \
            -DPrivate.Obfuscation=OFF

          cmake --build build_arm64 \
            --parallel "$(nproc)"


      # --------------------------------------------------
      # Build ARMv7
      # --------------------------------------------------
      - name: Build Armv7
        shell: bash
        run: |
          set -e

          rm -rf build_armv7

          cmake -S . -B build_armv7 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DDOBBY_DEBUG=OFF \
            -DDOBBY_BUILD_EXAMPLE=OFF \
            -DDOBBY_BUILD_TEST=OFF \
            -DPrivate.Obfuscation=OFF

          cmake --build build_armv7 \
            --parallel "$(nproc)"


      # --------------------------------------------------
      # Find generated libraries
      # --------------------------------------------------
      - name: Find Output Libraries
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "ARM64 outputs"
          echo "================================"

          find build_arm64 \
            -type f \
            \( \
              -name "*.so" \
              -o -name "*.a" \
            \) \
            -print

          echo ""
          echo "================================"
          echo "ARMv7 outputs"
          echo "================================"

          find build_armv7 \
            -type f \
            \( \
              -name "*.so" \
              -o -name "*.a" \
            \) \
            -print


      # --------------------------------------------------
      # Verify Uptime Faker library
      # --------------------------------------------------
      - name: Verify Uptime Faker
        shell: bash
        run: |
          set -e

          echo "Searching for libuptime_faker.so..."

          ARM64_LIB=$(find build_arm64 \
            -type f \
            -name "libuptime_faker.so" \
            | head -n 1)

          ARMV7_LIB=$(find build_armv7 \
            -type f \
            -name "libuptime_faker.so" \
            | head -n 1)

          if [ -z "$ARM64_LIB" ]; then
            echo "ERROR: ARM64 libuptime_faker.so not found"
            exit 1
          fi

          if [ -z "$ARMV7_LIB" ]; then
            echo "ERROR: ARMv7 libuptime_faker.so not found"
            exit 1
          fi

          echo ""
          echo "ARM64:"
          echo "$ARM64_LIB"
          file "$ARM64_LIB"

          echo ""
          echo "ARMv7:"
          echo "$ARMV7_LIB"
          file "$ARMV7_LIB"

          echo ""
          echo "Libraries verified."


      # --------------------------------------------------
      # Package module
      # --------------------------------------------------
      - name: Package ZIP
        shell: bash
        run: |
          set -e

          rm -rf dist
          rm -f UptimeFaker.zip

          mkdir -p dist/zygisk

          ARM64_LIB=$(find build_arm64 \
            -type f \
            -name "libuptime_faker.so" \
            | head -n 1)

          ARMV7_LIB=$(find build_armv7 \
            -type f \
            -name "libuptime_faker.so" \
            | head -n 1)

          cp "$ARM64_LIB" \
            dist/zygisk/arm64-v8a.so

          cp "$ARMV7_LIB" \
            dist/zygisk/armeabi-v7a.so

          cp module.prop dist/module.prop

          cd dist

          zip -r ../UptimeFaker.zip .


      # --------------------------------------------------
      # Verify final ZIP
      # --------------------------------------------------
      - name: Verify ZIP
        shell: bash
        run: |
          set -e

          test -f UptimeFaker.zip

          echo "================================"
          echo "ZIP CONTENTS"
          echo "================================"

          unzip -l UptimeFaker.zip

          echo ""
          echo "================================"
          echo "ZIP TEST"
          echo "================================"

          unzip -t UptimeFaker.zip


      # --------------------------------------------------
      # Upload artifact
      # --------------------------------------------------
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UptimeFaker
          path: UptimeFaker.zip
          if-no-files-found: error
