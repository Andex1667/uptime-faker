name: Build Zygisk Module

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Dobby Source
        run: |
          git clone --recursive https://github.com/jmpews/Dobby.git dobby
          # 에러를 일으키는 주범인 구형 ARM64 어셈블리 파일을 빈 파일로 날려버림
          rm -f dobby/source/TrampolineBridge/ClosureTrampolineBridge/arm64/closure_bridge_arm64.asm

      - name: Setup Android SDK & NDK (r23b)
        uses: android-actions/setup-android@v3
        with:
          ndk-version: 23.2.8568313

      - name: Build Arm64
        run: |
          mkdir build_arm64 && cd build_arm64
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 ..
          make
          
      - name: Build Armv7
        run: |
          mkdir build_armv7 && cd build_armv7
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=armeabi-v7a -DANDROID_PLATFORM=android-24 ..
          make

      - name: Package ZIP
        run: |
          mkdir -p dist/zygisk
          cp build_arm64/libuptime_faker.so dist/zygisk/arm64-v8a.so
          cp build_armv7/libuptime_faker.so dist/zygisk/armeabi-v7a.so
          cp module.prop dist/
          cd dist && zip -r ../UptimeFaker.zip *

      - uses: actions/upload-artifact@v4
        with:
          name: UptimeFaker
          path: UptimeFaker.zip
